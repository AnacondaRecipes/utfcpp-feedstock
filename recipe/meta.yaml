{% set name = "utfcpp" %}
{% set version = "4.0.9" %}
{% set sha256 = "397a9a2a6ed5238f854f490b0177b840abc6b62571ec3e07baa0bb94d3f14d5a" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: v{{ version }}.tar.gz
  url: https://github.com/nemtrif/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  # Only headers and CMake metadata are installed, not compiler-built binaries.
  ignore_run_exports_from:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - cmake >=3.14
    - ninja-base

test:
  commands:
    # Verify headers are installed.
    # Verify both include layouts: the legacy one used by pre-4.0 consumers,
    # and the canonical one the exported CMake target points at.
    - test -f $PREFIX/include/utf8.h                 # [unix]
    - test -d $PREFIX/include/utf8                   # [unix]
    - test -f $PREFIX/include/utf8cpp/utf8.h         # [unix]
    - test -d $PREFIX/include/utf8cpp/utf8           # [unix]
    # Verify the complete CMake package: the config includes the targets file,
    # and find_package() also loads the version file.
    - test -f $PREFIX/share/utf8cpp/cmake/utf8cppConfig.cmake         # [unix]
    - test -f $PREFIX/share/utf8cpp/cmake/utf8cppConfigVersion.cmake  # [unix]
    - test -f $PREFIX/share/utf8cpp/cmake/utf8cppTargets.cmake        # [unix]
    - if not exist %LIBRARY_INC%\\utf8.h exit 1                     # [win]
    - if not exist %LIBRARY_INC%\\utf8 exit 1                       # [win]
    - if not exist %LIBRARY_INC%\\utf8cpp\\utf8.h exit 1            # [win]
    - if not exist %LIBRARY_INC%\\utf8cpp\\utf8 exit 1              # [win]
    - if not exist %LIBRARY_PREFIX%\\share\\utf8cpp\\cmake\\utf8cppConfig.cmake exit 1         # [win]
    - if not exist %LIBRARY_PREFIX%\\share\\utf8cpp\\cmake\\utf8cppConfigVersion.cmake exit 1  # [win]
    - if not exist %LIBRARY_PREFIX%\\share\\utf8cpp\\cmake\\utf8cppTargets.cmake exit 1        # [win]

about:
  home: https://github.com/nemtrif/utfcpp
  license: BSL-1.0
  license_family: Other
  license_file: LICENSE
  summary: A simple, portable and lightweight generic library for handling UTF-8 encoded strings.
  description: |
    UTF-8 with C++ in a Portable Way

    An easily to handle generic library for UTF-8 encoded Unicode strings. For
    anybody used to work with STL algorithms and iterators, it should be easy
    and natural to use.
  doc_url: https://github.com/nemtrif/utfcpp/blob/master/README.md
  dev_url: https://github.com/nemtrif/utfcpp

extra:
  recipe-maintainers:
    - stuertz
